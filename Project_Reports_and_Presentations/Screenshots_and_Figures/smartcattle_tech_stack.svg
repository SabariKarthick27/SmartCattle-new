<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" width="100%" height="100%">
  <defs>
    <style>
      .border { stroke: #000000; stroke-width: 4px; fill: #ffffff; }
      .title { font-family: "Times New Roman", Times, Georgia, serif; font-size: 46px; font-weight: bold; fill: #000000; }
      .label { font-family: "Times New Roman", Times, Georgia, serif; font-size: 30px; font-weight: bold; fill: #000000; }
      .value { font-family: "Times New Roman", Times, Georgia, serif; font-size: 30px; font-weight: normal; fill: #000000; }
    </style>
  </defs>

  <!-- Background and Outer Border Frame -->
  <rect x="40" y="40" width="820" height="970" class="border" />

  <!-- Title -->
  <text x="75" y="140" class="title">TECHNOLOGY STACK</text>

  <!-- Content Lines -->
  <!-- 1. Frontend -->
  <text x="75" y="250">
    <tspan class="label">Frontend: </tspan>
    <tspan class="value">React, Next.js, TypeScript, Tailwind CSS</tspan>
  </text>

  <!-- 2. Backend -->
  <text x="75" y="360">
    <tspan class="label">Backend: </tspan>
    <tspan class="value">Python, FastAPI, Pydantic</tspan>
  </text>

  <!-- 3. Machine Learning -->
  <text x="75" y="470">
    <tspan class="label">Machine Learning: </tspan>
    <tspan class="value">Scikit-learn, SciPy, NumPy</tspan>
  </text>

  <!-- 4. Anomaly Analytics -->
  <text x="75" y="580">
    <tspan class="label">Anomaly Analytics: </tspan>
    <tspan class="value">Mahalanobis Metric, LOCO Attribution</tspan>
  </text>

  <!-- 5. Cattle Identification -->
  <text x="75" y="690">
    <tspan class="label">Cattle Identification: </tspan>
    <tspan class="value">QR Code, Camera Scanner</tspan>
  </text>

  <!-- 6. Database -->
  <text x="75" y="800">
    <tspan class="label">Database: </tspan>
    <tspan class="value">PostgreSQL, Prisma ORM</tspan>
  </text>

  <!-- 7. Security & Alerts -->
  <text x="75" y="910">
    <tspan class="label">Security &amp; Alerts: </tspan>
    <tspan class="value">NextAuth.js, Nodemailer</tspan>
  </text>
</svg>
